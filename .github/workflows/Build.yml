name: Build Package

on:
 workflow_dispatch:

jobs:
  build:
    name: Build RYMD-MaxMusic
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Dependencies
        run: brew install ldid xz

      - name: Setup Theos
        run: git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Setup iOS SDKs
        run: |
          rm -rf ${{ github.workspace }}/theos/sdks
          git clone https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

      - name: Clone YouTubeHeader
        run: |
          git clone --depth=1 https://github.com/PoomSmart/YouTubeHeader.git \
          ${{ github.workspace }}/theos/include/YouTubeHeader

      - name: Clone YouTubeMusicHeader
        run: |
          git clone --depth=1 https://github.com/PoomSmart/YouTubeMusicHeader.git \
          ${{ github.workspace }}/theos/include/YouTubeMusicHeader

      - name: Clone PSHeader 
        run: |
          git clone --depth=1 https://github.com/PoomSmart/PSHeader.git \
          ${{ github.workspace }}/theos/include/PSHeader 

      - name: Clone Return-YouTube-Dislikes
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git ../Return-YouTube-Dislikes

      - name: Build Package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          cp packages/*.deb output/
          cp ReturnYouTubeMusicDislikes.plist output/
          
          # Move the compiled dylib into the output folder for easy sideload access
          if [ -f .theos/obj/ReturnYouTubeMusicDislikes.dylib ]; then
            cp .theos/obj/ReturnYouTubeMusicDislikes.dylib output/
          elif [ -f .theos/obj/debug/ReturnYouTubeMusicDislikes.dylib ]; then
            cp .theos/obj/debug/ReturnYouTubeMusicDislikes.dylib output/
          fi

      - name: Generate Release Tag
        id: tag
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RYMD-MaxMusic ${{ steps.tag.outputs.version }}
          files: output/*
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
